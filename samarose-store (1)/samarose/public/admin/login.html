<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Roboto+Condensed:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="/css/site.css"><link rel="stylesheet" href="/css/admin.css"><link rel="stylesheet" href="/theme.css"></head>
<body class="login-page"><main class="login">
  <p class="brand">SamaRose</p><h1>Admin sign in</h1>
  <form id="login" novalidate>
    <div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="notice bad" id="err" role="alert" hidden></p>
    <button class="btn btn-block" type="submit">Sign in</button>
  </form>
  <p class="muted"><a class="link" href="/">Back to the shop</a></p>
</main><script src="/js/login.js" defer></script></body></html>
